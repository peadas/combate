<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ordem – Combate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="combate.css">
</head>
<body>
<script>
  function ordemErro(t){var a=document.getElementById("app");if(!a)return;a.innerHTML="";var p=document.createElement("pre");
    p.style.cssText="white-space:pre-wrap;color:#ff9b9b;padding:8px;font:12px monospace";p.textContent=t;a.appendChild(p);}
  addEventListener("error",function(e){ordemErro("Erro: "+(e.message||e.error))});
  addEventListener("unhandledrejection",function(e){ordemErro("Erro: "+(e.reason&&(e.reason.stack||e.reason.message)||e.reason))});
  setTimeout(function(){var c=document.querySelector(".carregando");if(c)ordemErro("Não conectou ao Owlbear em 10 s.\nEste painel só funciona aberto de dentro do Owlbear (ícone da extensão) e com uma cena aberta.")},10000);
</script>
<div id="app"><p class="carregando">Conectando ao Owlbear…</p></div>
<script type="module" src="./combate.js"></script>
</body>
</html>
